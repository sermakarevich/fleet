# tweet-watch as a flow (proposed format, see DESIGN.md §3.5, §3.7, §3.8).
# Replaces src/fleet/tweet_watch/ (about 1 550 lines of Python: fetch,
# watch_state.json, keyword scoring, template drafts, dedupe and voice
# heuristics) with one flow, one jev tool step, one coder step and three
# checks. Lives in the PRIVATE folder: it carries knowledge-base paths.
#
# One run per new tweet. The start's `key` is the "seen" memory, so
# watch_state.json goes away. Each item of `x watch check --format json`
# becomes the run's inputs: id, handle, text, url, created_at.

fleet_flow: 2
description: Propose a reply to each new tweet from watched handles that hits a core interest.

on:
  tool: {name: x_watch_check, every: 30m, key: "{{ item.id }}"}
  manual: true                      # fleet flow run tweet-watch --input url=... text=...

inputs:
  id:     {required: true}
  handle: {required: true}
  text:   {required: true}
  url:    {required: true}

defaults:
  coder: opencode
  model: opencode-go/muse-spark-1.3-contributor
  kb: /Users/sergii/.ai/knowledge/media        # free keys are fine; used as {{ defaults.kb }}

steps:

  # R3 interest scoring: a judge model, not a keyword list and not a coder.
  score:
    kind: tool
    tool: jev_choose
    args:
      question: Which interest tier does this tweet belong to, given the interests file?
      options: ["HIGH", "MEDIUM", "LOW"]
      state: |
        TWEET by @{{ inputs.handle }}:
        {{ inputs.text }}

        INTERESTS:
        {{ read_file(defaults.kb ~ '/INTERESTS.md') }}
    outputs: [answer, confidence]

  # R4, R5: one regular coder with the x tool attached and three checks.
  draft:
    needs: [score]
    skip_if: "{{ steps.score.outputs.answer != 'HIGH' }}"
    tools: [x_tweet]                # so it can read the thread, not only the one post
    retries: 2
    prompt: |
      Draft one reply post (max 280 characters) to {{ inputs.url }}.
      Read the whole thread first with the x_tweet tool.
      Voice rules are in {{ defaults.kb }}/INTERESTS.md under "Voice": plain
      language, no hype words, one concrete observation or number first,
      teaching tone, abbreviations explained on first use. Add something
      new; never praise only, never restate the tweet.
      Write outputs/outputs.json: {"reply": "<the post>"}.
    outputs: [reply]
    checks:
      - name: fresh                 # R4: not near-identical to a reply from the last 3 days
        tool: reply_dedupe
        args: {reply: "{{ outputs.reply }}", replies_dir: "{{ defaults.kb }}/x/replies", days: "3"}
        on_fail: retry              # the coder gets the message and tries another angle
      - name: voice                 # R5 draft rules, checked instead of hoped for
        tool: jev_check
        args:
          question: Does this reply follow every voice rule and add something new to the tweet?
          state: |
            RULES: {{ read_file(defaults.kb ~ '/INTERESTS.md') }}
            TWEET: {{ inputs.text }}
            REPLY: {{ outputs.reply }}
          min_confidence: "0.7"
        on_fail: retry
      - name: post                  # R5 human proposal; "yes" + the posted reply URL in the note
        kind: human
        prompt: |
          Reply to {{ inputs.url }} (@{{ inputs.handle }}):
          > {{ inputs.text }}

          Draft:
          {{ outputs.reply }}

          Post it? Answer yes and put the URL of your posted reply in the note.
        on_fail: skip               # "no" ends this run quietly, nothing is stored

  # R6 persistence: only after a confirmed post.
  save:
    needs: [draft]
    skip_if: "{{ steps.draft.status != 'succeeded' }}"
    kind: tool
    tool: save_reply
    args:
      replies_dir: "{{ defaults.kb }}/x/replies"
      source_url: "{{ inputs.url }}"
      reply_url: "{{ steps.draft.checks.post.message }}"
      text: "{{ steps.draft.outputs.reply }}"
      date: "{{ run.date }}"

# Tools this flow needs, all in the private folder's tools/:
#
# tools/x_watch_check.yaml   command: [x, watch, check, --format, json]   output: json
# tools/x_tweet.yaml         command: [x, tweet, "{{ args.url }}", --thread, --format, md]
# tools/reply_dedupe.yaml    command: [python3, "{{ tool.dir }}/reply_dedupe.py", ...]
#                            exit 1 + "near-duplicate of 2026-09-26-123.md" on a hit
# tools/save_reply.yaml      command: [python3, "{{ tool.dir }}/save_reply.py", ...]
#
# Built-in (ship with fleet):
# tools/jev_choose.yaml      command: [jev, choose, "{{ args.question }}", -o, ..., -s, "-"]
#                            stdin: "{{ args.state }}"   output: json -> {answer, confidence}
# tools/jev_check.yaml       command: [jev, check, "{{ args.question }}", -s, "-",
#                                      --min-confidence, "{{ args.min_confidence }}"]
#                            exit 2 when unsure -> the check fails with the reason
#
# The watchlist itself is `x watch add user:<handle>` (R1, R8 runbook), not
# a file fleet reads.
