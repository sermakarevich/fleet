      - First `cd {{inputs.repo}}` and check out branch `autocode/{{inputs.feature}}`
        (step 1 creates it from the default branch; later steps just check it out).
        Never commit to the default branch. Do all work under {{inputs.repo}}; the
        fleet worktree you were started in is not the target and stays untouched.
      - Favor simplicity, evolvability and maintainability over cleverness. Prefer
        readable code to comments and docstrings. Avoid complexity and needless
