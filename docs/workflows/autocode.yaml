      - Commit after every major step, adding files by named path
        (`git add <path>`; never `git add -A`). Scratch goes to `.local/` (listed in
        `.git/info/exclude`, never committed); `docs/{{inputs.feature}}/` is committed.
      - Tests are read-only after creation: never edit a test to fit the code. If a
        test looks wrong, ask through mcp__ask_human__ask_human_question and wait
        for the answer before touching it.
      - Limited test command while implementing: pre-existing test dirs plus your
        own folder only, never the full suite:
        `uv run pytest <existing test dirs> tests/{{inputs.feature}}/<own folder> -q`.
        Other new folders and the e2e stay red until their step lands.
      - Finishing: if the auto mode value above is exactly "on", decide alone, write
        outputs.json and finish. Otherwise call mcp__ask_human__ask_human_question
        with a short summary of your understanding and what you did, WAIT for the
        answer, apply any corrections, and only then write outputs.json and finish.
      - Always write $FLEET_TASK_DIR/outputs.json: a flat JSON object of strings
        with exactly the keys listed under "Outputs" below, so later steps can use
        them.
    needs:
    - failures
- name: scaffold
  steps:
  - name: scaffold
    title: 'autocode {{inputs.feature}}: 04 scaffold flow and empty objects'
    description: |
      Step 4/11 of autocode for {{inputs.feature}}.
      Create the scaffold: the flow plus empty objects the tests will import.
      No logic yet.

      Do:
      1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
      2. Read {{steps.requirements.outputs.requirements_path}} and every file in `docs/{{inputs.feature}}/failures/`.
      3. Create the modules, classes and functions that the requirements (R*)
         and shared modules (M*) need, following the repo's existing layout and
         naming. Every object body is empty (`raise NotImplementedError`) and
         carries a temporary docstring saying: what it must do, which unit it
         serves, its dependencies and its dependants. These docstrings are
         removed once the object is implemented (align step). Wire the main flow
         (entry point calling the objects in order) the same way.
      4. Make sure everything imports: `uv run python -c "import <package>"` and
         the existing tests still pass ({{steps.baseline.outputs.test_command}}).
      5. Commit the scaffold files by named path:
         "autocode({{inputs.feature}}): scaffold".

      Outputs: {"scaffold_commit": "<full sha of the scaffold commit>"}

      Global rules (same for every autocode step):
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
        (a file path or the spec text itself). Auto mode: {{inputs.auto}}.
      - First `cd {{inputs.repo}}` and check out branch `autocode/{{inputs.feature}}`
        (step 1 creates it from the default branch; later steps just check it out).
        Never commit to the default branch. Do all work under {{inputs.repo}}; the
        fleet worktree you were started in is not the target and stays untouched.
      - Favor simplicity, evolvability and maintainability over cleverness. Prefer
        readable code to comments and docstrings. Avoid complexity and needless
        abstractions.
      - Commit after every major step, adding files by named path
        (`git add <path>`; never `git add -A`). Scratch goes to `.local/` (listed in
        `.git/info/exclude`, never committed); `docs/{{inputs.feature}}/` is committed.
      - Tests are read-only after creation: never edit a test to fit the code. If a
        test looks wrong, ask through mcp__ask_human__ask_human_question and wait
        for the answer before touching it.
      - Limited test command while implementing: pre-existing test dirs plus your
        own folder only, never the full suite:
        `uv run pytest <existing test dirs> tests/{{inputs.feature}}/<own folder> -q`.
        Other new folders and the e2e stay red until their step lands.
      - Finishing: if the auto mode value above is exactly "on", decide alone, write
        outputs.json and finish. Otherwise call mcp__ask_human__ask_human_question
        with a short summary of your understanding and what you did, WAIT for the
        answer, apply any corrections, and only then write outputs.json and finish.
      - Always write $FLEET_TASK_DIR/outputs.json: a flat JSON object of strings
        with exactly the keys listed under "Outputs" below, so later steps can use
        them.
    needs:
    - baseline
- name: unittests
  steps:
  - name: unittests
    title: 'autocode {{inputs.feature}}: 05 unit tests per unit, up front (one worker per unit)'
    needs:
    - scaffold
    worker: job
    job_gate: 'off'
    description: |
      Step 5/11 of autocode for {{inputs.feature}}: unit tests per unit, up front.
      This is a JOB step. Fleet runs it as research -> design -> spawn children
      -> validate, and gives every unit its own child worker. You never do the
      unit work yourself.

      Units (every unit, M* and R*): take them from `{{steps.requirements.outputs.units}}`, which lists every unit of
      {{steps.requirements.outputs.requirements_path}} in order (shared modules M* first, then requirements R*).

      Research phase: `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`, read {{steps.requirements.outputs.requirements_path}}. Write
      RESEARCH.md with the units in scope, in order, one line each: id and its
      one-line summary. Do not explore the rest of the repo.

      Design phase: write tasks.json with exactly one task per unit in scope, in
      that order:
      - key: the unit id in lowercase (e.g. "r1"); title:
        "autocode {{inputs.feature}}: 05 unit tests <UNIT>" (at most 120 characters);
      - cwd, coder and model: null; priority: 2;
      - depends_on: the previous task's key ([] for the first), so the children
        run one at a time: they all commit to the same branch checkout;
      - body: the child instructions below, verbatim, with every <UNIT> replaced
        by the unit id (e.g. R1) and every <unit> by its lowercase form (e.g. r1).
      DESIGN.md: one line per task.

      Validate phase: check that `tests/{{inputs.feature}}/<unit>/` exists, collects
      (`uv run pytest tests/{{inputs.feature}} --collect-only -q`) and is committed for every unit. Report a missing unit as partial with a follow-up
      for that unit only.

      ----- child instructions (the body of every child task) -----
      Unit <UNIT> of autocode for {{inputs.feature}}: unit tests per unit, up front.

      Write every unit test for <UNIT> now, before any logic exists.

      Do:
      1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
      2. Read the <UNIT> section of {{steps.requirements.outputs.requirements_path}} and
         `docs/{{inputs.feature}}/failures/<UNIT>.md`.
      3. Create `tests/{{inputs.feature}}/<unit>/`, mirroring the code layout; one
         file per test or per small group of related tests. Cover the unit's
         behaviour and every failure case listed for it. Import the real objects
         from the scaffold; do not stub the unit under test. This folder is the
         unit's acceptance criterion later: "its folder is green".
      4. Do not make the tests pass; they are expected to fail on the scaffold.
         Only check they collect: `uv run pytest tests/{{inputs.feature}}/<unit> --collect-only -q`.
      5. Commit: `git add tests/{{inputs.feature}}/<unit>` and commit
         "autocode({{inputs.feature}}): unit tests <UNIT>".

      Rules for this unit worker:
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
        (a file path or the spec text itself). Auto mode: {{inputs.auto}}.
      - First `cd {{inputs.repo}}` and check out branch `autocode/{{inputs.feature}}`
        (step 1 creates it from the default branch; later steps just check it out).
        Never commit to the default branch. Do all work under {{inputs.repo}}; the
        fleet worktree you were started in is not the target and stays untouched.
      - Favor simplicity, evolvability and maintainability over cleverness. Prefer
        readable code to comments and docstrings. Avoid complexity and needless
        abstractions.
      - Commit after every major step, adding files by named path
        (`git add <path>`; never `git add -A`). Scratch goes to `.local/` (listed in
        `.git/info/exclude`, never committed); `docs/{{inputs.feature}}/` is committed.
      - Tests are read-only after creation: never edit a test to fit the code. If a
        test looks wrong, ask through mcp__ask_human__ask_human_question and wait
        for the answer before touching it.
      - Limited test command while implementing: pre-existing test dirs plus your
        own folder only, never the full suite:
        `uv run pytest <existing test dirs> tests/{{inputs.feature}}/<own folder> -q`.
        Other new folders and the e2e stay red until their step lands.
      - Work on unit <UNIT> only; other units have their own workers, one at a time.
      - Do not ask the operator to confirm at the end (the unit list was confirmed in
        step 1). Ask through mcp__ask_human__ask_human_question only when a test looks
        wrong or the requirement is contradictory, and wait for the answer.
- name: e2e
  steps:
  - name: e2e
    title: 'autocode {{inputs.feature}}: 06 write the main-path end-to-end test'
    description: |
      Step 6/11 of autocode for {{inputs.feature}}.
      Write one end-to-end test for the main path, up front.

      Do:
      1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
      2. Read {{steps.requirements.outputs.requirements_path}}; identify the main happy path through the whole feature
         (entry point to final output).
      3. Create `tests/{{inputs.feature}}/main/` with one end-to-end test that
         drives the real flow (real modules, real files or fixtures; fake only
         external services). Assert the final observable result, not internals.
      4. Check it collects (`uv run pytest tests/{{inputs.feature}}/main
         --collect-only -q`); it is expected to fail on the scaffold.
      5. Commit: `git add tests/{{inputs.feature}}/main` and commit
         "autocode({{inputs.feature}}): e2e test".

      Outputs: {"e2e_dir": "tests/{{inputs.feature}}/main"}

      Global rules (same for every autocode step):
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
        (a file path or the spec text itself). Auto mode: {{inputs.auto}}.
