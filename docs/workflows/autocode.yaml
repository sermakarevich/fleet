# Design rationale (static YAML, not a builder):
# - The 11 steps are fixed and known before the run starts, so a static
#   definition is enough and stays editable in the UI. Only the number of
#   *units* (shared modules M* and requirements R* from step 1) is unknown
#   up front, so the per-unit steps (failures, unittests, implement) are
#   `worker: job` steps: the job worker designs one child task per unit at
#   runtime and closes once every child is done (operator decision,
#   2026-09-26). `job_gate: "off"` skips the child-list approval; the unit
#   list is confirmed once, in step 1.
# - Unit children are chained (each depends on the previous one) because
#   they all commit to the same branch checkout of the target repo.
# - Per-unit steps write to fixed paths (docs/<feature>/failures/<UNIT>.md,
#   tests/<feature>/<unit>/) instead of outputs.json, since a job step has
#   no single worker to write outputs.
# - Sequential by operator decision (2026-09-26): every stage holds one step
#   and each step `needs` the previous one, so later stages render only
#   after the earlier step closes and can read its `outputs.json` values via
#   `{{steps.<name>.outputs.<key>}}`.
# - `cwd` is left unset on purpose: fleet renders templates only into
#   titles and descriptions, never into `cwd`, so `{{inputs.repo}}` cannot be
#   a step cwd today. Each step instead cd's into the repo and works on the
#   branch `autocode/<feature>` (operator decision A, 2026-09-26). The fleet
#   worktree the worker starts in stays untouched and closes with no commits.
# - Generated file: the shared rule blocks are repeated in every step on
#   purpose (a step description must be self-contained).

fleet_workflow: 1
name: autocode
description: Sequential autonomous coding of one feature in a repo (spec to requirements, then one worker
  per unit for failure modes, unit tests and implementation; baseline, scaffold, e2e, review, gate).
defaults:
  coder: opencode
  model: opencode-go/muse-spark-1.3-contributor
  priority: 2
  isolation: worktree
inputs:
- name: repo
  description: Absolute path of the target git repository; every step cd's there and works on branch autocode/<feature>.
  required: true
- name: feature
  description: Short feature slug (e.g. auth); names docs/<feature>/, tests/<feature>/ and the branch.
  required: true
- name: spec
  description: Feature spec, as an absolute file path or the spec text itself.
  required: true
- name: auto
  description: '"on" = the worker decides alone and closes each step; anything else = it confirms its
    understanding through ask_human at the end of every step.'
  default: 'off'
stages:
- name: spec-requirements
  steps:
  - name: requirements
    title: 'autocode {{inputs.feature}}: 01 spec to requirements'
    description: |
      Step 1/11 of autocode for {{inputs.feature}}.
      Turn the spec into a numbered list of testable requirements. This list
      drives the rest of the run: later steps start one worker per unit.

      Do:
      1. `cd {{inputs.repo}}`; create branch `autocode/{{inputs.feature}}` from the
         default branch if it does not exist, else check it out. Add `.local/`,
         `.vscode/` and `justfile` to `.git/info/exclude` if missing.
      2. Read the spec ({{inputs.spec}}; if it is a path, read the file). Read
         README.md, AGENTS.md / CLAUDE.md and the existing code layout enough to
         place the feature.
      3. Write `docs/{{inputs.feature}}/REQUIREMENTS.md`:
         - "Shared modules": code several requirements need, one heading per
           module (`## M1 <name>`, `## M2 ...`), may be empty.
         - "Requirements": one heading per requirement (`## R1 <name>`, ...),
           each stating the observable behaviour, its inputs and outputs, and
           which shared module(s) it needs.
         Each unit (M* or R*) must be small enough for one worker in one
         sitting. Keep it concrete; no design prose.
      4. Commit: `git add docs/{{inputs.feature}}/REQUIREMENTS.md` and commit
         "autocode({{inputs.feature}}): requirements".

      Outputs: {"requirements_path": "<absolute path of REQUIREMENTS.md>",
                "units": "<every unit id, space separated, shared modules first, e.g. M1 M2 R1 R2 R3>"}

      Global rules (same for every autocode step):
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
        (a file path or the spec text itself). Auto mode: {{inputs.auto}}.
      - First `cd {{inputs.repo}}` and check out branch `autocode/{{inputs.feature}}`
        (step 1 creates it from the default branch; later steps just check it out).
        Never commit to the default branch. Do all work under {{inputs.repo}}; the
        fleet worktree you were started in is not the target and stays untouched.
      - Favor simplicity, evolvability and maintainability over cleverness. Prefer
        readable code to comments and docstrings. Avoid complexity and needless
        abstractions.
      - Commit after every major step, adding files by named path
        (`git add <path>`; never `git add -A`). Scratch goes to `.local/` (listed in
        `.git/info/exclude`, never committed); `docs/{{inputs.feature}}/` is committed.
      - Tests are read-only after creation: never edit a test to fit the code. If a
        test looks wrong, ask through mcp__ask_human__ask_human_question and wait
        for the answer before touching it.
      - Limited test command while implementing: pre-existing test dirs plus your
        own folder only, never the full suite:
        `uv run pytest <existing test dirs> tests/{{inputs.feature}}/<own folder> -q`.
        Other new folders and the e2e stay red until their step lands.
      - Finishing: if the auto mode value above is exactly "on", decide alone, write
        outputs.json and finish. Otherwise call mcp__ask_human__ask_human_question
        with a short summary of your understanding and what you did, WAIT for the
        answer, apply any corrections, and only then write outputs.json and finish.
      - Always write $FLEET_TASK_DIR/outputs.json: a flat JSON object of strings
        with exactly the keys listed under "Outputs" below, so later steps can use
        them.
- name: spec-failures
  steps:
  - name: failures
    title: 'autocode {{inputs.feature}}: 02 failure modes per unit (one worker per unit)'
    needs:
    - requirements
    worker: job
    job_gate: 'off'
    description: |
      Step 2/11 of autocode for {{inputs.feature}}: failure modes per unit.
      This is a JOB step. Fleet runs it as research -> design -> spawn children
      -> validate, and gives every unit its own child worker. You never do the
      unit work yourself.

      Units (every unit, M* and R*): take them from `{{steps.requirements.outputs.units}}`, which lists every unit of
      {{steps.requirements.outputs.requirements_path}} in order (shared modules M* first, then requirements R*).

      Research phase: `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`, read {{steps.requirements.outputs.requirements_path}}. Write
      RESEARCH.md with the units in scope, in order, one line each: id and its
      one-line summary. Do not explore the rest of the repo.

      Design phase: write tasks.json with exactly one task per unit in scope, in
      that order:
      - key: the unit id in lowercase (e.g. "r1"); title:
        "autocode {{inputs.feature}}: 02 failure modes <UNIT>" (at most 120 characters);
      - cwd, coder and model: null; priority: 2;
      - depends_on: the previous task's key ([] for the first), so the children
        run one at a time: they all commit to the same branch checkout;
      - body: the child instructions below, verbatim, with every <UNIT> replaced
        by the unit id (e.g. R1) and every <unit> by its lowercase form (e.g. r1).
      DESIGN.md: one line per task.

      Validate phase: check that `docs/{{inputs.feature}}/failures/<UNIT>.md` exists and is committed on
      `autocode/{{inputs.feature}}` for every unit. Report a missing unit as partial with a follow-up
      for that unit only.

      ----- child instructions (the body of every child task) -----
      Unit <UNIT> of autocode for {{inputs.feature}}: failure modes per unit.

      Do:
      1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
      2. Read the <UNIT> section of {{steps.requirements.outputs.requirements_path}}.
      3. Write `docs/{{inputs.feature}}/failures/<UNIT>.md`: concrete failure cases for
         <UNIT>: bad or missing input, boundary values, external errors, wrong
         state, concurrency where relevant. Each case states the expected
         behaviour (error, fallback, message). Real cases only, no generic filler.
      4. Commit: `git add docs/{{inputs.feature}}/failures/<UNIT>.md` and commit
         "autocode({{inputs.feature}}): failure modes <UNIT>".

      Rules for this unit worker:
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
        (a file path or the spec text itself). Auto mode: {{inputs.auto}}.
      - First `cd {{inputs.repo}}` and check out branch `autocode/{{inputs.feature}}`
        (step 1 creates it from the default branch; later steps just check it out).
        Never commit to the default branch. Do all work under {{inputs.repo}}; the
        fleet worktree you were started in is not the target and stays untouched.
      - Favor simplicity, evolvability and maintainability over cleverness. Prefer
        readable code to comments and docstrings. Avoid complexity and needless
        abstractions.
      - Commit after every major step, adding files by named path
        (`git add <path>`; never `git add -A`). Scratch goes to `.local/` (listed in
        `.git/info/exclude`, never committed); `docs/{{inputs.feature}}/` is committed.
      - Tests are read-only after creation: never edit a test to fit the code. If a
        test looks wrong, ask through mcp__ask_human__ask_human_question and wait
        for the answer before touching it.
      - Limited test command while implementing: pre-existing test dirs plus your
        own folder only, never the full suite:
        `uv run pytest <existing test dirs> tests/{{inputs.feature}}/<own folder> -q`.
        Other new folders and the e2e stay red until their step lands.
      - Work on unit <UNIT> only; other units have their own workers, one at a time.
      - Do not ask the operator to confirm at the end (the unit list was confirmed in
        step 1). Ask through mcp__ask_human__ask_human_question only when a test looks
        wrong or the requirement is contradictory, and wait for the answer.
- name: baseline
  steps:
  - name: baseline
    title: 'autocode {{inputs.feature}}: 03 green baseline of existing tests'
    description: |
      Step 3/11 of autocode for {{inputs.feature}}.
      Run the existing tests before any new test exists and record the baseline.

      Do:
      1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
      2. Find the repo's test command (justfile, pyproject, Makefile, CI config)
         and its existing test directories. Sync the environment if needed
         (`uv sync`).
      3. Run the existing suite. Do not fix or edit any existing test.
      4. Write `docs/{{inputs.feature}}/BASELINE.md`: the exact command, the
         existing test dirs (space separated), the pass/fail counts and the
         list of any pre-existing failures. If tests fail before your work, do
         not fix them: record them as the accepted baseline. When auto mode is
         not "on", mention them in your ask_human summary.
      5. Commit: `git add docs/{{inputs.feature}}/BASELINE.md` and commit
         "autocode({{inputs.feature}}): baseline".

      Outputs: {"baseline_log": "<absolute path of BASELINE.md>",
                "existing_test_dirs": "<space separated existing test dirs, e.g. tests>",
                "test_command": "<exact command used, e.g. uv run pytest tests -q>"}

      Global rules (same for every autocode step):
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
        (a file path or the spec text itself). Auto mode: {{inputs.auto}}.
      - First `cd {{inputs.repo}}` and check out branch `autocode/{{inputs.feature}}`
        (step 1 creates it from the default branch; later steps just check it out).
        Never commit to the default branch. Do all work under {{inputs.repo}}; the
        fleet worktree you were started in is not the target and stays untouched.
      - Favor simplicity, evolvability and maintainability over cleverness. Prefer
        readable code to comments and docstrings. Avoid complexity and needless
