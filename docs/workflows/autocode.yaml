  - name: scaffold
    steps:
      - name: scaffold
        title: 'autocode {{inputs.feature}}: 04 scaffold flow and empty objects'
        needs: [baseline]
        description: |
          Step 4/12 of autocode for {{inputs.feature}}.
          Create the scaffold: the flow plus empty objects the tests will import.
          No logic yet.

          Do:
          1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
          2. Read {{steps.requirements.outputs.requirements_path}} and
             {{steps.failures.outputs.failure_modes_path}}.
          3. Create the modules, classes and functions that the requirements (R*)
             and shared modules (M*) need, following the repo's existing layout and
             naming. Every object body is empty (`raise NotImplementedError`) and
             carries a temporary docstring saying: what it must do, which
             requirement it serves, its dependencies and its dependants. These
             docstrings are removed once the object is implemented (align step).
             Wire the main flow (entry point calling the objects in order) the same
             way.
          4. Make sure everything imports: `uv run python -c "import <package>"` and
             the limited test command with the existing dirs only
             ({{steps.baseline.outputs.test_command}}) still passes.
          5. Commit the scaffold files by named path:
             "autocode({{inputs.feature}}): scaffold".

          Outputs: {"scaffold_commit": "<full sha of the scaffold commit>"}

