            with exactly the keys listed under "Outputs" below, so later steps can use
            them.
  - name: unittests
    steps:
      - name: unittests
        title: 'autocode {{inputs.feature}}: 05 write all unit tests up front'
        needs: [scaffold]
        description: |
          Step 5/12 of autocode for {{inputs.feature}}.
          Write every unit test now, before any logic exists.

          Do:
          1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}` (scaffold
             commit {{steps.scaffold.outputs.scaffold_commit}}).
          2. Read {{steps.requirements.outputs.requirements_path}} and
             {{steps.failures.outputs.failure_modes_path}}.
          3. Create one folder per unit (each requirement R* and each shared module
             M*) under `tests/{{inputs.feature}}/<unit>/`, mirroring the code layout.
             Inside, one file per test or per small group of related tests. Cover
             the requirement's behaviour and every failure case listed for it.
             Import the real objects from the scaffold; do not stub the unit under
             test. Each test folder later becomes one atomic implementation unit
             whose acceptance criterion is "its folder is green".
          4. Do not run the new tests to make them pass; they are expected to fail
             on the scaffold. Only check they collect:
             `uv run pytest tests/{{inputs.feature}} --collect-only -q`.
          5. Commit: `git add tests/{{inputs.feature}}` and commit
             "autocode({{inputs.feature}}): unit tests".

          Outputs: {"unit_test_dirs": "<space separated list of the unit test folders, e.g. tests/{{inputs.feature}}/r1 tests/{{inputs.feature}}/m1>"}

