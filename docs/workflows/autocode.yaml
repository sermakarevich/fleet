  - name: implement-feature
    steps:
      - name: feature
        title: 'autocode {{inputs.feature}}: 09 implement the requirements'
        needs: [common]
        description: |
          Step 9/12 of autocode for {{inputs.feature}}.
          Implement every requirement (R*) on top of the shared modules.

          Do:
          1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}` (shared
             modules landed in {{steps.common.outputs.common_commit}}).
          2. Read {{steps.requirements.outputs.requirements_path}} and
             {{steps.red.outputs.red_log}}.
          3. For each requirement, one at a time, in order: implement it, then run
             `uv run pytest {{steps.baseline.outputs.existing_test_dirs}} tests/{{inputs.feature}}/<that requirement's folder> -q`
             until that folder is green while the old tests stay green. Acceptance
             criterion per requirement: its folder is green. Never run the full
             suite and never touch a test. Commit each requirement by named path:
             "autocode({{inputs.feature}}): implement R<n>".
          4. Do not start the e2e or cross-requirement polishing here.

          Outputs: {"feature_commit": "<full sha of the last requirement commit>"}

