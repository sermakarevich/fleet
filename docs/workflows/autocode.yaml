  - name: e2e
    steps:
      - name: e2e
        title: 'autocode {{inputs.feature}}: 06 write the main-path end-to-end test'
        needs: [unittests]
        description: |
          Step 6/12 of autocode for {{inputs.feature}}.
          Write one end-to-end test for the main path, up front.

          Do:
          1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
          2. Read {{steps.requirements.outputs.requirements_path}}; identify the
             main happy path through the whole feature (entry point to final
             output).
          3. Create `tests/{{inputs.feature}}/main/` with one end-to-end test that
             drives the real flow (real modules, real files or fixtures; fake only
             external services). Assert the final observable result, not internals.
          4. Check it collects (`uv run pytest tests/{{inputs.feature}}/main
             --collect-only -q`); it is expected to fail on the scaffold.
          5. Commit: `git add tests/{{inputs.feature}}/main` and commit
             "autocode({{inputs.feature}}): e2e test".

          Outputs: {"e2e_dir": "tests/{{inputs.feature}}/main"}

