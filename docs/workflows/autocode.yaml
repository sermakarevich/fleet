        answer, apply any corrections, and only then write outputs.json and finish.
      - Always write $FLEET_TASK_DIR/outputs.json: a flat JSON object of strings
        with exactly the keys listed under "Outputs" below, so later steps can use
        them.
    needs:
    - unittests
- name: red
  steps:
  - name: red
    title: 'autocode {{inputs.feature}}: 07 run new tests: red for new, green for old'
    description: |
      Step 7/11 of autocode for {{inputs.feature}}.
      Confirm the starting point: new tests red, old tests green.

      Do:
      1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
      2. Run the old suite: {{steps.baseline.outputs.test_command}}. It must match {{steps.baseline.outputs.baseline_log}} (same passes,
         no new failures). If the scaffold broke an old test, fix the scaffold,
         never the test.
      3. Run the new tests: `uv run pytest tests/{{inputs.feature}} -q`.
         Expect them to fail. A new test that already passes on the empty
         scaffold is suspicious (vacuous test): list it in the log. Do not edit
         tests; if one must change, ask through ask_human first.
      4. Write `docs/{{inputs.feature}}/RED.md` with both commands, the counts
         and the suspicious list. Commit: `git add docs/{{inputs.feature}}/RED.md`,
         "autocode({{inputs.feature}}): red run".

      Outputs: {"red_log": "<absolute path of RED.md>"}

      Global rules (same for every autocode step):
      - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
