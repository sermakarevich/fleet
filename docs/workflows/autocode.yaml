  - name: implement-common
    steps:
      - name: common
        title: 'autocode {{inputs.feature}}: 08 implement shared modules'
        needs: [red]
        description: |
          Step 8/12 of autocode for {{inputs.feature}}.
          Implement the shared modules (M*) first; the requirements come later.

          Do:
          1. `cd {{inputs.repo}}`, check out `autocode/{{inputs.feature}}`.
          2. Read {{steps.requirements.outputs.requirements_path}} (section
             "Shared modules") and {{steps.red.outputs.red_log}}.
          3. For each shared module, one at a time: implement it, then run
             `uv run pytest {{steps.baseline.outputs.existing_test_dirs}} tests/{{inputs.feature}}/<that module's folder> -q`
             until that folder is green while the old tests stay green. Never run
             the full suite and never touch a test. Commit each module by named
             path: "autocode({{inputs.feature}}): implement <module>".
          4. Requirement folders and the e2e may still be red; that is expected.

          Outputs: {"common_commit": "<full sha of the last shared-module commit>"}

          Global rules (same for every autocode step):
          - Repo: {{inputs.repo}}. Feature slug: {{inputs.feature}}. Spec: {{inputs.spec}}
