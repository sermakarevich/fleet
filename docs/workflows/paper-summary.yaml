fleet_workflow: 1
name: paper-summary
description: Fetch a paper, summarise it, and file the note in the knowledge base.
inputs:
  - name: paper_url
    description: URL of the paper to summarise.
    required: true
  - name: focus
    description: What to pay attention to while summarising.
    default: methods and results
defaults: {coder: opencode, priority: 2}
stages:
  - name: read
    steps:
      - name: fetch
        title: "Fetch {{inputs.paper_url}}"
        description: "Download the paper at {{inputs.paper_url}} and focus on {{inputs.focus}}.
          Record the local PDF path in outputs.json under the key pdf_path."
  - name: draft
    steps:
      - name: summarize
        title: "Summarise {{inputs.paper_url}}"
        description: "Read {{steps.fetch.outputs.pdf_path}} and write a summary aimed at {{inputs.focus}}.
          Record the note path in outputs.json under the key note_path."
  - name: file
    steps:
      - name: file-note
        title: "File the summary note"
        description: "Move {{steps.summarize.outputs.note_path}} into the knowledge base tree.
          This step writes into the auto-synced tree, so it runs in place."
        isolation: none
