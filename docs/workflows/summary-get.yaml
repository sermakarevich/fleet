fleet_workflow: 1
name: summary_get
description: >
  Summarize a URL into an LLM-wiki folder in the knowledge base (ai:summary:get recipe).
  The builder fetches the source (yt for YouTube, x for X/Twitter, pdftotext for arXiv/PDF,
  HTML extraction otherwise), splits it into chunks and creates one wiki-page task per chunk,
  then digest/summary, explainer/questions/critical-thinking, index, and a verify step
  that blocks the run unless the finished entry satisfies the recipe.
builder: summary_get
defaults:
  cwd: /Users/sergii/.ai
  coder: claude
  model: sonnet
  priority: 2
  isolation: none
inputs:
  - name: url
    description: Source URL (YouTube, X/Twitter, arXiv/PDF, or an article page)
    required: true
  - name: chunk_chars
    description: Target characters per chunk (2000–60000)
    default: "12000"
