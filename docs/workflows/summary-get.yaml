fleet_workflow: 1
name: summary_get
description: >
  Summarize a URL into an LLM-wiki folder in the knowledge base (ai:summary:get recipe).
  The builder fetches the source (yt for YouTube, x for X/Twitter, pdftotext for arXiv/PDF,
  shallow git clone for GitHub repos, HTML extraction otherwise), splits it into chunks
  (one per macro component for repos) and creates one wiki-page task per chunk,
  then digest/summary, explainer/questions/critical-thinking, index, a verify step
  that blocks the run unless the finished entry satisfies the recipe, and a final
  file step that moves the entry into structured_papers/ (standalone runs;
  runs spawned by a research epic skip filing — the research copy bead moves
  the entry into research/<epic>/sources/ instead).
builder: summary_get
defaults:
  cwd: /Users/sergii/.ai
  coder: claude
  model: sonnet
  priority: 2
  isolation: none
inputs:
  - name: url
    description: Source URL (YouTube, X/Twitter, arXiv/PDF, GitHub repo, or an article page)
    required: true
  - name: chunk_chars
    description: Target characters per chunk (2000–60000)
    default: "12000"
  - name: research_target
    description: Research epic target owning this run (absolute path or slug). Empty for standalone runs; set by research design so the file step skips filing.
    default: ""
