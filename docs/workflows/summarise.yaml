fleet_workflow: 1
name: summarise
description: >
  Summarize a URL into an LLM-wiki folder in the knowledge base (ai:summary:get recipe).
  The builder fetches the source (yt for YouTube, x for X/Twitter, pdftotext for arXiv/PDF,
  shallow git clone for GitHub repos, HTML extraction otherwise), splits it into chunks
  (one per macro component for repos) and creates one wiki-page task per chunk,
  then digest/summary, explainer/questions/critical-thinking, index, and a verify step
  that blocks the run unless the finished entry satisfies the recipe. The finished
  entry stays in research/<Slug>/ (investment/ for finance topics); filing it elsewhere
  is a separate deliberate act via the ai:summary:move recipe, and runs spawned by
  a research epic are copied into research/<epic>/sources/ by the research copy bead.
builder: summarise
defaults:
  cwd: /Users/sergii/.ai
  coder: claude
  model: sonnet
  priority: 2
  isolation: none
inputs:
  - name: url
    description: Source URL (YouTube, X/Twitter, arXiv/PDF, GitHub repo, or an article page)
    required: true
  - name: chunk_chars
    description: Target characters per chunk (2000–60000)
    default: "12000"
  - name: research_target
    description: Research epic target that spawned this run (absolute path or slug). Empty for standalone runs; recorded for provenance only — nothing in this workflow files or moves the entry.
    default: ""
