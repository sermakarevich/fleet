name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: extractions/setup-just@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/fleet/ui/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: npm ci
        working-directory: src/fleet/ui
      - run: just check-all
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/fleet/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/fleet/ui/package-lock.json
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev
      - run: npm ci
      - run: just ui-types-check
      - run: npx tsc --noEmit
      - run: npm run build
