name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --group dev
      # TODO: drop --exit-zero once the baseline is clean
      - run: uv run ruff check src tests --exit-zero
      - run: uv run pytest tests -q -p no:cacheprovider
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/fleet/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/fleet/ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
