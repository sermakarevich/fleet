[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "structlog>=24",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "watchfiles>=0.21",
    "mcp>=1.0.0,<2",
    "pyyaml>=6",
]

[project.scripts]
fleet = "fleet.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fleet*"]

[tool.setuptools.package-data]
fleet = ["templates/*", "coders/hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "C4", "PL"]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/", "src/fleet/ui/"]
