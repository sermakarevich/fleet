fleet_flow: 2
description: >-
  Compatibility flow: turn each ready bead into a run. Polled from
  `bd_ready`; one run per bead id. The work step runs a coder on the
  bead title and description, then the close step closes the bead.
  `coder`, `model`, `cwd` and `isolation` render to "" when the bead
  carries no override; the engine treats "" as unset.
"on": # quoted: bare `on:` parses as boolean True under YAML 1.1
  tool:
    name: bd_ready
    every: 30s
    key: "{{ item.id }}"
  manual: false
inputs:
  id:
    description: Bead id (run key and closed on completion).
    required: true
  title:
    description: Bead title, first line of the work prompt.
    required: true
  description:
    description: Bead description, body of the work prompt.
    required: true
  coder:
    description: Coder override from bead metadata (fleet_coder); "" means unset.
    default: ""
  model:
    description: Model override from bead metadata (fleet_model); "" means unset.
    default: ""
  cwd:
    description: Working directory from bead metadata (fleet_cwd); "" means unset.
    default: ""
  isolation:
    description: Isolation override from bead metadata (fleet_isolation); "" means unset.
    default: ""
steps:
  work:
    needs: []
    prompt: |
      Bead {{ inputs.id }}: {{ inputs.title }}

      {{ inputs.description }}
    coder: "{{ inputs.coder }}"
    model: "{{ inputs.model }}"
    cwd: "{{ inputs.cwd }}"
    isolation: "{{ inputs.isolation }}"
  close:
    kind: tool
    tool: bd_close
    args:
      id: "{{ inputs.id }}"
    needs: [work]
